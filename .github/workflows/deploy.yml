# CMarket deploy: publish the production image to GHCR, then ask Dokploy to
# redeploy.
#
# Runs ONLY after the CI workflow has passed on a push to develop or main, so a
# commit that failed any quality gate is never published or deployed.
#
#   develop -> ghcr.io/<owner>/<repo>:develop  -> GitHub Environment "develop"
#   main    -> ghcr.io/<owner>/<repo>:main     -> GitHub Environment "production"
#   both    -> also tagged :sha-<full commit sha> (immutable, for rollback)
#
# Secrets (decided 2026-11-27):
#   - GHCR uses the built-in GITHUB_TOKEN (packages: write). No PAT is stored.
#   - Each GitHub Environment holds exactly one secret, DOKPLOY_WEBHOOK_URL,
#     the redeploy webhook of that environment's Dokploy application.
#   - Application runtime secrets (DATABASE_URL, NEXTAUTH_SECRET, CLOUDINARY_*,
#     EMAIL_*, CLEANUP_TOKEN, ...) live ONLY in Dokploy's Environment tab. They
#     are never passed to this workflow or baked into the image (FR-100).
#
# If an environment has no DOKPLOY_WEBHOOK_URL yet, the image is still
# published and the deploy step is skipped with a notice, not a failure.

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [develop, main]

concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    # Only a SUCCESSFUL CI run triggered by a PUSH (merge) deploys; CI runs on
    # pull requests never do.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image: ${{ steps.target.outputs.image }}
    steps:
      - name: Resolve target
        id: target
        run: |
          branch="${{ github.event.workflow_run.head_branch }}"
          case "$branch" in
            main)    environment=production ;;
            develop) environment=develop ;;
            *) echo "unexpected branch: $branch" >&2; exit 1 ;;
          esac
          repo="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      # Build exactly the commit CI validated, not whatever the branch points
      # to now.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:${{ steps.target.outputs.branch }}
            ${{ steps.target.outputs.image }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Operations image: the Dockerfile's `builder` stage (source, full
      # node_modules incl. tsx, generated Prisma client). The standalone runtime
      # image ships no scripts/ and no tsx, so bootstrap-master, create-community
      # and the scheduled archive-suspended-communities job run from this one
      # (docker-compose.prod.yml `tools` service). It carries no secrets:
      # .dockerignore keeps every .env out of the build context.
      - name: Build and push tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          push: true
          tags: |
            ${{ steps.target.outputs.image }}:${{ steps.target.outputs.branch }}-tools
            ${{ steps.target.outputs.image }}:sha-${{ github.event.workflow_run.head_sha }}-tools
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.publish.outputs.environment }}
    permissions: {}
    steps:
      - name: Trigger Dokploy redeploy
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
            echo "::notice::DOKPLOY_WEBHOOK_URL is not set for environment '${{ needs.publish.outputs.environment }}'; image published, deploy skipped."
            exit 0
          fi
          # The URL is a secret: never echo it. -f fails the step on an HTTP error.
          curl -fsS -X POST --max-time 30 --retry 2 --retry-delay 5 "$DOKPLOY_WEBHOOK_URL" > /dev/null
          echo "Dokploy redeploy requested for ${{ needs.publish.outputs.environment }} (${{ needs.publish.outputs.image }}:${{ github.event.workflow_run.head_branch }})."
